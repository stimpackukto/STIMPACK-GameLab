name: Development test PHP syntax

on:
  push:
    branches: [main]
    paths:
      - 'test/**'
      - 'api/devtest/**'
      - 'includes/devtest.php'
      - 'includes/devtest_mail.php'
      - 'auth/google_login.php'
      - 'auth/google_callback.php'
      - '.github/workflows/devtest-php-lint.yml'
  pull_request:
    paths:
      - 'test/**'
      - 'includes/devtest.php'
      - 'includes/devtest_mail.php'
      - 'auth/google_login.php'
      - 'auth/google_callback.php'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          php -v
          php -l test/index.php
          php -l test/confirm.php
          php -l api/devtest/confirm.php
          php -l includes/devtest.php
          php -l includes/devtest_mail.php
          php -l auth/google_login.php
          php -l auth/google_callback.php
