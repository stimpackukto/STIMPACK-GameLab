# STIMPACK GAME LAB — nginx 정적 파일 캐시 예시
# 이 블록은 실제 server { } 내부에 병합해야 합니다.
# 기존 location /, PHP, OAuth, 광고, WebSocket 규칙을 덮어쓰지 마세요.
# 배포 전: sudo nginx -t
#
# CSS/JS에는 이미 파일 수정시각 ?v= 버전이 붙습니다.
# 캐시 파라미터가 없는 파일까지 immutable을 설정하면 변경이 늦게 반영될 수 있으므로
# max-age를 보수적으로 제한합니다.
location ~* ^/assets/.*\.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}
# QR 파일은 URL 자체에 앱 ID/Google Play 주소의 해시를 사용하므로
# 앱 주소를 수정하면 새로운 파일명으로 자동 갱신됩니다.
# 기존 /assets/ location 블록과 중복되지 않도록 운영 설정 검토 필요.
#
# PHP OPcache, APCu 실행 상태 확인:
# php -m | grep -E 'Zend OPcache|apcu'
# CLI의 apcu 활성 상태와 PHP-FPM 활성 상태는 다를 수 있습니다.
# php8.1-fpm 실제 ini 설정을 확인하세요.
#
# 로그인/관리자/리뷰/댓글/게임 API에 FastCGI 전체 페이지 캐시를 적용하지 않습니다.
