# 참고용 예시입니다.
# 기존 forum.pe.kr 설정 파일을 통째로 덮어쓰지 마세요.
# 실제 설정에서는 기존 SSL / PHP-FPM / 보안 헤더를 유지하고
# root만 /var/www/gamelab 로 변경하는 방식이 가장 안전합니다.

server {
    server_name forum.pe.kr www.forum.pe.kr;

    root /var/www/gamelab;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # 기존 certbot SSL 설정은 현재 서버 설정을 그대로 사용
}
